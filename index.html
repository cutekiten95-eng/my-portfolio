<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Portfolio</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="loader">Loading...</div>

<nav>
  <h2>MyBrand</h2>

  <div class="nav-links">
    <a href="#home">Home</a>
    <a href="#services">Services</a>
    <a href="#projects">Projects</a>
    <a href="#contact">Contact</a>
  </div>

  <div class="lang">
    <button onclick="setLang('en')">EN</button>
    <button onclick="setLang('fr')">FR</button>
    <button onclick="setLang('ar')">AR</button>
    <button onclick="setLang('de')">DE</button>
  </div>
</nav>

<section id="home" class="fade">
  <h1 data-key="title">I build websites that bring clients</h1>
  <p data-key="desc">Fast. Clean. Powerful.</p>

  <a href="#contact" class="btn">Start Project</a>
</section>

<section id="services" class="fade">
  <h2>Services</h2>

  <div class="grid">
    <div class="card" onclick="openService('web')">Website Dev</div>
    <div class="card" onclick="openService('python')">Automation</div>
    <div class="card" onclick="openService('data')">Data</div>
  </div>
</section>

<section id="projects" class="fade">
  <h2>Projects</h2>
  <div class="card" onclick="openModal()">View Project</div>
</section>

<section id="contact" class="fade">
  <h2>Start Now</h2>
  <a href="https://www.fiverr.com" class="btn">Contact Me</a>
</section>

<!-- MODAL -->
<div id="modal">
  <div class="modal-box">
    <span onclick="closeModal()">✖</span>
    <h2>Project Details</h2>
  </div>
</div>

<!-- SERVICE MODAL -->
<div id="serviceModal">
  <div class="modal-box">
    <span onclick="closeService()">✖</span>
    <p id="serviceText"></p>
  </div>
</div>

<!-- POPUP -->
<div id="popup">
  <div class="popup-box">
    <h2>Wait!</h2>
    <a href="#contact" class="btn">Start Now</a>
  </div>
</div>

<a href="#contact" class="sticky">Start</a>

<script src="script.js"></script>
</body>
</html>
